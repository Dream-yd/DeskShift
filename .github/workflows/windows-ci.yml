name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MeetingDesktop.sln
      - run: dotnet build MeetingDesktop.sln -c Release --no-restore
      - run: dotnet test MeetingDesktop.sln -c Release --no-build --logger trx
